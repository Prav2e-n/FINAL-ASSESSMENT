<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Customer Dashboard</title>
  <style>
    * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Arial', sans-serif;
}

body {
  display: flex;
  height: 100vh;
  background-color: #f0f4fc;
}

.dashboard {
  display: flex;
  width: 100%;
}

.sidebar {
  width: 220px;
  background-color: #a1a3f5;
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.logo {
  font-weight: bold;
  font-size: 20px;
  margin-bottom: 20px;
  color: white;
}

.nav-item {
  display: block;
  padding: 10px;
  color: white;
  text-decoration: none;
  margin-bottom: 10px;
  border-radius: 6px;
}

.nav-item.active,
.nav-item:hover {
  background-color: #7d80ea;
}

.bottom-section {
  margin-top: auto;
}

.profile {
  display: flex;
  align-items: center;
  margin-top: 20px;
}

.profile img {
  border-radius: 50%;
  margin-right: 10px;
}

.main {
  flex: 1;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.actions .btn {
  padding: 8px 16px;
  margin-left: 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.import {
  background-color: #e0e0e0;
}

.add {
  background-color: #5b6ef5;
  color: white;
}

.stats {
  display: flex;
  gap: 20px;
  margin: 20px 0;
}

.card {
  background-color: white;
  padding: 20px;
  border-radius: 10px;
  flex: 1;
  box-shadow: 0 1px 5px rgba(0,0,0,0.1);
}

.table table {
  width: 100%;
  background-color: white;
  border-collapse: collapse;
  border-radius: 10px;
  overflow: hidden;
}

.table th,
.table td {
  padding: 12px;
  text-align: left;
  border-bottom: 1px solid #eee;
}

.status {
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 12px;
}

.status.green {
  background-color: #d4f8e8;
  color: #1a7f55;
}

.avatar {
  border-radius: 50%;
}

.bar {
  width: 100px;
  height: 8px;
  background: #e0e0e0;
  border-radius: 4px;
  overflow: hidden;
}

.bar .fill {
  width: 70%;
  height: 100%;
  background: #5b6ef5;
}

  </style>
 
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="logo">Untitled UI</div>
      <nav class="nav">
        <a href="#" class="nav-item active">Home</a>
        <a href="#" class="nav-item">Notifications</a>
        <a href="#" class="nav-item">Projects</a>
        <a href="#" class="nav-item">Tasks</a>
        <a href="#" class="nav-item">Reporting</a>
        <a href="#" class="nav-item">Users</a>
      </nav>
      <div class="bottom-section">
        <a href="#" class="nav-item">Support</a>
        <a href="#" class="nav-item">Settings</a>
        <div class="profile">
          <img src= alt="Profile" />
          <div class="profile-name">Frankie Sullivan</div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <h1>Customers</h1>
        <div class="actions">
          <button class="btn import">Import</button>
          <button class="btn add">+ Add Customer</button>
        </div>
      </header>

      <section class="stats">
        <div class="card">
          <h2>Total Customers</h2>
          <p>2,420</p>
        </div>
        <div class="card">
          <h2>Members</h2>
          <p>1,210</p>
        </div>
        <div class="card">
          <h2>Active Now</h2>
          <p>316</p>
        </div>
      </section>

      <section class="table">
        <table>
          <thead>
            <tr>
              <th>Company</th>
              <th>Status</th>
              <th>About</th>
              <th>Users</th>
              <th>License Use</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Catalog</td>
              <td><span class="status green">Customer</span></td>
              <td>Content curating app</td>
              <td><img class="avatar" src="https://i.pravatar.cc/30?img=1" /></td>
              <td><div class="bar"><div class="fill"></div></div></td>
              <td>
                <button></button>
                <button></button>
              </td>
            </tr>
         </tbody>
        </table>
      </section>
    </main>
  </div>
</body>
</html>
