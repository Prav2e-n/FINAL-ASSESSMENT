<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jully Baby Store - Login/Register</title>
  <style>* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', sans-serif;
  }
  
  body {
    background: #fdfdfd;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  
  .container {
    display: flex;
    width: 90%;
    max-width: 1200px;
    height: 90vh;
    background: linear-gradient(45deg, #f7faff, #fff);
    border-radius: 25px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    overflow: hidden;
  }
  
  .panel {
    background: #f6f9f9;
    width: 25%;
    padding: 40px 20px;
    text-align: center;
    background-color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
    border-right: 2px solid #f0f0f0;
  }
  
  .logo {
    width: 130px;
    margin: 0 auto 20px;
  }
  
  .btn {
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }
  
  .btn.primary {
    background-color: #38c2b6;
    color: white;
  }
  
  .btn.outline {
    border: 2px solid #38c2b6;
    color: #333;
    background: transparent;
  }
  
  .form-container {
    width: 37.5%;
    padding: 40px;
    position: relative;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  
  .form-container h2 {
    font-size: 20px;
    color: #333;
    margin-bottom: 20px;
  }
  
  .form-container h2 span {
    font-size: 16px;
    color: #999;
  }
  
  form input {
    width: 100%;
    padding: 12px 15px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }
  
  .forgot {
    text-align: right;
    margin-bottom: 20px;
  }
  
  .forgot a {
    text-decoration: none;
    color: #888;
    font-size: 14px;
  }
  
  .divider {
    text-align: center;
    color: #aaa;
    margin: 20px 0 10px;
    font-size: 14px;
  }
  
  .socials {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 15px;
  }
  
  .social {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #f1f1f1;
    border: none;
    font-size: 18px;
    cursor: pointer;
  }
  
  .bottom-text {
    text-align: center;
    font-size: 14px;
  }
  
  .bottom-text a {
    color: #38c2b6;
    text-decoration: none;
    font-weight: bold;
  }
  
  @media (max-width: 1024px) {
    .container {
      flex-direction: column;
      height: auto;
    }
  
    .panel, .form-container {
      width: 100%;
      border-right: none;
      border-bottom: 1px solid #eee;
    }
  }
  

  </style>
 
</head>
<body>
  <div class="container">
   <div class="panel">
      <img src= alt="Jully Logo" class="logo" />
      <button class="btn primary">Login</button>
      <button class="btn outline">Register</button>
    </div>

   
    <div class="form-container">
      <img src= alt="Jully Logo" class="logo" />
      <h2>Welcome back!<br><span>Glad to see you, Again!</span></h2>
      <form>
        <input type="email" placeholder="Enter your email" required />
        <input type="password" placeholder="Enter your password" required />
        <div class="forgot">
          <a href="#">Forgot Password?</a>
        </div>
        <button class="btn primary">Login</button>
      </form>
      <div class="divider">Or Login with</div>
      <div class="socials">
        <button class="social">f</button>
        <button class="social">G</button>
        <button class="social"></button>
      </div>
      <p class="bottom-text">Don’t have an account? <a href="#">Register Now</a></p>
    </div>

    
    <div class="form-container">
      <img src= alt="Jully Logo" class="logo" />
      <h2>Hello!<br><span>Register to get started</span></h2>
      <form>
        <input type="text" placeholder="Username" required />
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Password" required />
        <input type="password" placeholder="Confirm password" required />
        <button class="btn primary">Register</button>
      </form>
      <div class="divider">Or Register with</div>
      <div class="socials">
        <button class="social">f</button>
        <button class="social">G</button>
        <button class="social"></button>
      </div>
      <p class="bottom-text">Already have an account? <a href="#">Login Now</a></p>
    </div>
  </div>
</body>
</html>
